<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawSocial — Red social para mascotas</title>
<style>
  :root{
    --primary:#FF7A59;
    --primary-dark:#E85D3D;
    --secondary:#4ECDC4;
    --accent:#FFC65C;
    --bg:#FFF8F3;
    --card:#FFFFFF;
    --text:#2E2A26;
    --text-soft:#8A8178;
    --border:#F1E7DD;
    --danger:#E8564B;
    --success:#3FB68B;
    --radius:18px;
    --shadow:0 8px 24px rgba(60,40,20,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(circle at 20% 10%, #FFE3C9 0%, #FBD3B8 25%, #2b2320 100%);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
    color:var(--text);
  }
  .phone{
    width:430px;height:900px;max-height:96vh;
    background:var(--bg);
    border-radius:44px;
    border:9px solid #171310;
    box-shadow:0 40px 80px rgba(0,0,0,0.45), inset 0 0 0 2px #000;
    overflow:hidden;
    display:flex;flex-direction:column;
    position:relative;
  }
  @media (max-width:480px){
    .phone{width:100vw;height:100vh;max-height:100vh;border-radius:0;border:none;}
  }
  .notch{
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:150px;height:26px;background:#171310;border-radius:0 0 18px 18px;z-index:50;
  }
  .app-header{
    padding:34px 20px 12px;
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;color:var(--primary-dark);}
  .brand span.dot{color:var(--secondary);}
  .header-icon-btn{
    width:38px;height:38px;border-radius:50%;background:var(--bg);border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;
  }
  .badge-dot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;background:var(--danger);border-radius:50%;border:2px solid var(--card);}
  .app-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:100px;}
  .app-body::-webkit-scrollbar{width:6px;}
  .app-body::-webkit-scrollbar-thumb{background:#e0d3c4;border-radius:4px;}
  .bottom-nav{
    position:absolute;bottom:0;left:0;right:0;
    background:var(--card);border-top:1px solid var(--border);
    display:flex;justify-content:space-around;align-items:center;
    padding:10px 8px 22px;flex-shrink:0;z-index:40;
  }
  .nav-btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    background:none;border:none;cursor:pointer;color:var(--text-soft);
    font-size:10px;font-weight:600;padding:4px 10px;border-radius:12px;transition:.15s;
  }
  .nav-btn .icon{font-size:20px;}
  .nav-btn.active{color:var(--primary-dark);background:#FFF1E8;}
  .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--border);}
  h2.section-title{font-size:17px;margin:4px 2px 12px;font-weight:800;}
  .muted{color:var(--text-soft);font-size:13px;}
  .btn{
    background:var(--primary);color:#fff;border:none;border-radius:12px;
    padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;transition:.15s;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn.secondary{background:var(--secondary);}
  .btn.secondary:hover{background:#3bb2aa;}
  .btn.outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
  .btn.outline:hover{border-color:var(--primary);color:var(--primary-dark);}
  .btn.block{width:100%;}
  .btn.sm{padding:7px 12px;font-size:12px;border-radius:10px;}
  input,select,textarea{
    width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);
    font-family:inherit;font-size:14px;background:#fff;color:var(--text);margin-top:4px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);}
  label{font-size:12px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.03em;}
  .field{margin-bottom:12px;}
  .row{display:flex;gap:10px;}
  .row>.field{flex:1;}

  /* Feed */
  .composer-avatar,.avatar{
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0;background:var(--accent);color:#fff;font-weight:700;
  }
  .avatar.sm{width:30px;height:30px;font-size:14px;}
  .post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .post-head .names{line-height:1.25;}
  .post-head .pet-name{font-weight:800;font-size:14px;}
  .post-head .owner-name{font-size:12px;color:var(--text-soft);}
  .post-photo{
    width:100%;aspect-ratio:1/1;border-radius:14px;object-fit:cover;margin-bottom:10px;background:#eee;
  }
  .post-photo.placeholder{display:flex;align-items:center;justify-content:center;font-size:70px;}
  .post-caption{font-size:14px;line-height:1.4;margin-bottom:8px;}
  .post-actions{display:flex;gap:16px;align-items:center;margin-bottom:6px;}
  .like-btn{background:none;border:none;cursor:pointer;font-size:20px;display:flex;align-items:center;gap:6px;color:var(--text-soft);font-weight:700;font-size:13px;}
  .like-btn.liked{color:var(--danger);}
  .comment-list{margin-top:6px;}
  .comment-item{font-size:13px;margin-bottom:4px;}
  .comment-item b{margin-right:4px;}
  .comment-form{display:flex;gap:8px;margin-top:8px;}
  .comment-form input{margin-top:0;}
  .time-ago{font-size:11px;color:var(--text-soft);margin-left:auto;}

  /* Chips / filters */
  .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .chip{
    flex-shrink:0;padding:8px 14px;border-radius:20px;background:#fff;border:1.5px solid var(--border);
    font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);white-space:nowrap;
  }
  .chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* Citas */
  .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
  .service-card{
    background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s;
  }
  .service-card.selected{border-color:var(--primary);background:#FFF1E8;}
  .service-card .ic{font-size:24px;}
  .service-card .lbl{font-size:11px;font-weight:700;margin-top:4px;}
  .appt-item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
  .appt-item:last-child{border-bottom:none;}
  .appt-ic{width:44px;height:44px;border-radius:12px;background:#FFF1E8;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
  .appt-info{flex:1;}
  .appt-info .t1{font-weight:700;font-size:14px;}
  .appt-info .t2{font-size:12px;color:var(--text-soft);}
  .status-pill{font-size:10px;font-weight:800;padding:4px 8px;border-radius:8px;text-transform:uppercase;}
  .status-pill.confirmada{background:#E3F7EE;color:var(--success);}
  .status-pill.pendiente{background:#FFF3D6;color:#B8860B;}

  /* Marketplace */
  .market-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .product-card{background:#fff;border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .product-photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f2ede6;display:flex;align-items:center;justify-content:center;font-size:48px;}
  .product-body{padding:10px;}
  .product-title{font-size:13px;font-weight:700;line-height:1.3;margin-bottom:2px;}
  .product-price{color:var(--primary-dark);font-weight:800;font-size:14px;margin-bottom:6px;}
  .product-seller{font-size:11px;color:var(--text-soft);margin-bottom:8px;}

  /* Messages */
  .conv-item{display:flex;gap:10px;align-items:center;padding:10px 4px;cursor:pointer;border-radius:12px;}
  .conv-item:hover{background:#fff;}
  .conv-info{flex:1;min-width:0;}
  .conv-name{font-weight:700;font-size:14px;}
  .conv-preview{font-size:12px;color:var(--text-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .unread-badge{background:var(--primary);color:#fff;font-size:10px;font-weight:800;border-radius:10px;padding:2px 7px;}
  .chat-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .chat-thread{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  .msg-bubble{max-width:75%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.35;}
  .msg-bubble.me{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px;}
  .msg-bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--border);border-bottom-left-radius:4px;}
  .chat-input-row{display:flex;gap:8px;position:sticky;bottom:0;}
  .chat-input-row input{margin-top:0;}
  .back-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px;}

  /* Profile */
  .profile-header{text-align:center;padding:10px 0 6px;}
  .profile-avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 10px;font-size:38px;display:flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;font-weight:700;object-fit:cover;}
  .profile-name{font-weight:800;font-size:18px;}
  .stats-row{display:flex;justify-content:center;gap:26px;margin:14px 0;}
  .stat{text-align:center;}
  .stat b{display:block;font-size:16px;}
  .stat span{font-size:11px;color:var(--text-soft);}
  .pet-card{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
  .pet-card:last-child{border-bottom:none;}
  .pet-avatar{width:48px;height:48px;border-radius:50%;background:#FFF1E8;display:flex;align-items:center;justify-content:center;font-size:24px;object-fit:cover;}
  .pet-card .t1{font-weight:700;font-size:14px;}
  .pet-card .t2{font-size:12px;color:var(--text-soft);}

  /* Modal */
  .modal-overlay{
    position:absolute;inset:0;background:rgba(20,15,10,0.45);display:none;align-items:flex-end;justify-content:center;z-index:60;
  }
  .modal-overlay.open{display:flex;}
  .modal-sheet{
    background:var(--bg);width:100%;max-height:85%;overflow-y:auto;border-radius:24px 24px 0 0;padding:20px;
    animation:slideup .22s ease;
  }
  @keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-title{font-size:17px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
  .close-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-soft);}
  .photo-input-preview{width:90px;height:90px;border-radius:14px;background:#f2ede6;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:8px;overflow:hidden;cursor:pointer;border:1.5px dashed var(--border);}
  .photo-input-preview img{width:100%;height:100%;object-fit:cover;}
  .fab{
    position:absolute;bottom:96px;right:18px;width:52px;height:52px;border-radius:50%;
    background:var(--primary);color:#fff;font-size:26px;border:none;box-shadow:0 10px 20px rgba(255,122,89,0.4);
    cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center;
  }
  .toast{
    position:absolute;top:70px;left:50%;transform:translateX(-50%);background:#2E2A26;color:#fff;
    padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:100;opacity:0;
    transition:opacity .25s, top .25s;pointer-events:none;
  }
  .toast.show{opacity:1;top:86px;}
  .empty-state{text-align:center;padding:40px 10px;color:var(--text-soft);}
  .empty-state .ic{font-size:44px;margin-bottom:10px;}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>
  <div class="app-header">
    <div class="brand">🐾 Paw<span class="dot">Social</span></div>
    <div style="display:flex;gap:8px;">
      <button class="header-icon-btn" id="notifBtn">🔔<span class="badge-dot" id="notifDot" style="display:none;"></span></button>
    </div>
  </div>
  <div class="app-body" id="appBody"></div>
  <button class="fab" id="fabBtn" title="Nueva publicación">+</button>
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn" data-view="feed"><span class="icon">🏠</span>Feed</button>
    <button class="nav-btn" data-view="citas"><span class="icon">📅</span>Citas</button>
    <button class="nav-btn" data-view="market"><span class="icon">🛍️</span>Tienda</button>
    <button class="nav-btn" data-view="messages"><span class="icon">💬</span>Mensajes</button>
    <button class="nav-btn" data-view="profile"><span class="icon">🐶</span>Perfil</button>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-sheet" id="modalSheet"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ---------------- STATE ---------------- */
let uidCounter = 1000;
function uid(){ return 'id' + (uidCounter++); }

const state = {
  view: 'feed',
  activeConvId: null,
  selectedServiceId: null,
  marketFilter: 'Todos',
  currentUser: { id:'me', name:'Vanessa', avatar:null, avatarEmoji:'🙋‍♀️', bio:'Amante de los animales 🐾', pets:['p1','p2'] },
  users: {
    u1:{id:'u1', name:'Carlos Ramírez', avatarEmoji:'🧑'},
    u2:{id:'u2', name:'Sofía Martínez', avatarEmoji:'👩'},
    u3:{id:'u3', name:'Vet. Ana Torres', avatarEmoji:'👩‍⚕️'},
    u4:{id:'u4', name:'Pipo Pet Shop', avatarEmoji:'🏪'},
  },
  pets: {
    p1:{id:'p1', name:'Rocky', species:'Perro', breed:'Golden Retriever', emoji:'🐕', ownerId:'me', photo:null},
    p2:{id:'p2', name:'Mimi', species:'Gato', breed:'Siamés', emoji:'🐈', ownerId:'me', photo:null},
    p3:{id:'p3', name:'Toby', species:'Perro', breed:'Beagle', emoji:'🐶', ownerId:'u1', photo:null},
    p4:{id:'p4', name:'Luna', species:'Gato', breed:'Persa', emoji:'🐱', ownerId:'u2', photo:null},
  },
  posts: [
    {id:'post1', petId:'p3', ownerId:'u1', caption:'Día de playa con Toby 🏖️ ¡le encantó el agua!', photo:null, photoEmoji:'🐶', gradient:'linear-gradient(135deg,#89CFF0,#4ECDC4)', likes:['me','u2'], comments:[{userId:'u2', text:'¡Qué lindo! 😍'}], time: Date.now()-1000*60*60*3},
    {id:'post2', petId:'p4', ownerId:'u2', caption:'Luna descubrió una caja nueva... otra vez 📦😹', photo:null, photoEmoji:'🐱', gradient:'linear-gradient(135deg,#FFC65C,#FF7A59)', likes:['me'], comments:[], time: Date.now()-1000*60*60*8},
    {id:'post3', petId:'p1', ownerId:'me', caption:'Rocky se graduó de su curso de obediencia 🎓🐕', photo:null, photoEmoji:'🐕', gradient:'linear-gradient(135deg,#A8E6CF,#3FB68B)', likes:['u1','u2'], comments:[{userId:'u1', text:'¡Felicidades campeón!'}], time: Date.now()-1000*60*60*26},
  ],
  services: [
    {id:'vet', name:'Veterinario', icon:'🩺'},
    {id:'groom', name:'Peluquería', icon:'✂️'},
    {id:'walk', name:'Paseador', icon:'🦮'},
    {id:'stay', name:'Guardería', icon:'🏠'},
    {id:'train', name:'Entrenamiento', icon:'🎓'},
    {id:'spa', name:'Spa & Baño', icon:'🛁'},
  ],
  appointments: [
    {id:'a1', petId:'p1', serviceId:'vet', provider:'Clínica VetCare', location:'Col. Escalón', date: new Date(Date.now()+1000*60*60*24*2).toISOString().slice(0,10), time:'10:30', status:'confirmada', notes:'Vacuna anual'},
    {id:'a2', petId:'p2', serviceId:'groom', provider:'Pet Style Spa', location:'Multiplaza', date: new Date(Date.now()+1000*60*60*24*5).toISOString().slice(0,10), time:'15:00', status:'pendiente', notes:''},
  ],
  products: [
    {id:'pr1', title:'Croquetas Premium Adulto 15kg', price:38.50, category:'Alimento', sellerId:'u4', emoji:'🥫', desc:'Alimento balanceado para perros adultos, rico en proteína.'},
    {id:'pr2', title:'Rascador de torre para gatos', price:29.99, category:'Accesorios', sellerId:'u2', emoji:'🐾', desc:'Rascador de 3 niveles, poco uso, como nuevo.'},
    {id:'pr3', title:'Correa retráctil 5m', price:12.00, category:'Accesorios', sellerId:'u1', emoji:'🦴', desc:'Correa resistente, ideal para paseos largos.'},
    {id:'pr4', title:'Cama ortopédica talla M', price:24.00, category:'Accesorios', sellerId:'u4', emoji:'🛏️', desc:'Espuma viscoelástica, funda lavable.'},
    {id:'pr5', title:'Consulta veterinaria a domicilio', price:20.00, category:'Servicios', sellerId:'u3', emoji:'🩺', desc:'Chequeo general en la comodidad de tu hogar.'},
    {id:'pr6', title:'Snacks naturales de pollo', price:6.50, category:'Alimento', sellerId:'u4', emoji:'🍗', desc:'Bolsa de 200g, sin conservantes.'},
  ],
  conversations: {
    u1:{ userId:'u1', unread:1, messages:[
      {from:'u1', text:'¡Hola! Vi que te gustó la foto de Toby 😄', time:Date.now()-1000*60*90},
      {from:'u1', text:'¿Rocky y Toby deberían tener una cita de juego algún día?', time:Date.now()-1000*60*80},
    ]},
    u4:{ userId:'u4', unread:0, messages:[
      {from:'me', text:'Hola, ¿tienen las croquetas en stock?', time:Date.now()-1000*60*60*20},
      {from:'u4', text:'¡Sí! Tenemos disponible, con gusto te la reservamos 🙌', time:Date.now()-1000*60*60*19},
    ]},
  }
};

/* ---------------- HELPERS ---------------- */
function petsOfUser(userId){ return Object.values(state.pets).filter(p=>p.ownerId===userId); }
function userLabel(userId){ return userId==='me' ? state.currentUser.name : (state.users[userId]?.name || 'Usuario'); }
function userAvatarHtml(userId, size){
  const cls = size==='sm' ? 'avatar sm' : 'avatar';
  if(userId==='me'){
    return state.currentUser.photo
      ? `<img class="${cls}" src="${state.currentUser.photo}" style="object-fit:cover;">`
      : `<div class="${cls}">${state.currentUser.avatarEmoji}</div>`;
  }
  const u = state.users[userId];
  return `<div class="${cls}">${u ? u.avatarEmoji : '👤'}</div>`;
}
function timeAgo(ts){
  const diff = Math.floor((Date.now()-ts)/1000);
  if(diff<60) return 'ahora';
  if(diff<3600) return Math.floor(diff/60)+'m';
  if(diff<86400) return Math.floor(diff/3600)+'h';
  return Math.floor(diff/86400)+'d';
}
function money(n){ return '$'+n.toFixed(2); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(()=>t.classList.remove('show'), 2200);
}
function readFileAsDataUrl(file, cb){
  const reader = new FileReader();
  reader.onload = e => cb(e.target.result);
  reader.readAsDataURL(file);
}

/* ---------------- RENDER ROOT ---------------- */
function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.view===state.view);
  });
  document.getElementById('fabBtn').style.display = (state.view==='feed'||state.view==='market') ? 'flex' : 'none';
  const body = document.getElementById('appBody');
  if(state.view==='feed') body.innerHTML = renderFeed();
  else if(state.view==='citas') body.innerHTML = renderCitas();
  else if(state.view==='market') body.innerHTML = renderMarket();
  else if(state.view==='messages') body.innerHTML = renderMessages();
  else if(state.view==='profile') body.innerHTML = renderProfile();
  body.scrollTop = 0;
  updateNotifDot();
  attachViewHandlers();
}

function updateNotifDot(){
  const anyUnread = Object.values(state.conversations).some(c=>c.unread>0);
  document.getElementById('notifDot').style.display = anyUnread ? 'block' : 'none';
}

/* ---------------- FEED ---------------- */
function renderFeed(){
  const posts = [...state.posts].sort((a,b)=>b.time-a.time);
  return `
    <h2 class="section-title">Feed de mascotas 🐾</h2>
    ${posts.map(p=>renderPost(p)).join('') || `<div class="empty-state"><div class="ic">📸</div>Aún no hay publicaciones.<br>¡Sé el primero en compartir algo!</div>`}
  `;
}
function renderPost(p){
  const pet = state.pets[p.petId];
  const liked = p.likes.includes('me');
  const photoHtml = p.photo
    ? `<img class="post-photo" src="${p.photo}">`
    : `<div class="post-photo placeholder" style="background:${p.gradient}">${p.photoEmoji}</div>`;
  return `
  <div class="card" data-post="${p.id}">
    <div class="post-head">
      <div class="avatar" style="background:#FFF1E8;">${pet.emoji}</div>
      <div class="names">
        <div class="pet-name">${esc(pet.name)} <span class="muted" style="font-weight:500;">· ${esc(pet.breed)}</span></div>
        <div class="owner-name">por ${esc(userLabel(p.ownerId))}</div>
      </div>
      <div class="time-ago">${timeAgo(p.time)}</div>
    </div>
    ${photoHtml}
    <div class="post-caption">${esc(p.caption)}</div>
    <div class="post-actions">
      <button class="like-btn ${liked?'liked':''}" data-action="like" data-id="${p.id}">${liked?'❤️':'🤍'} ${p.likes.length}</button>
      <span class="muted">💬 ${p.comments.length} comentarios</span>
    </div>
    <div class="comment-list">
      ${p.comments.map(c=>`<div class="comment-item"><b>${esc(userLabel(c.userId))}</b>${esc(c.text)}</div>`).join('')}
    </div>
    <form class="comment-form" data-action="comment" data-id="${p.id}">
      <input type="text" placeholder="Escribe un comentario..." name="comment" autocomplete="off">
      <button class="btn sm" type="submit">Enviar</button>
    </form>
  </div>`;
}

/* ---------------- CITAS ---------------- */
function renderCitas(){
  const myPets = petsOfUser('me');
  const upcoming = [...state.appointments].sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
  return `
    <h2 class="section-title">Agenda una cita 📅</h2>
    <div class="card">
      <div class="service-grid">
        ${state.services.map(s=>`
          <div class="service-card ${state.selectedServiceId===s.id?'selected':''}" data-action="pick-service" data-id="${s.id}">
            <div class="ic">${s.icon}</div>
            <div class="lbl">${s.name}</div>
          </div>`).join('')}
      </div>
      <form id="apptForm" data-action="book-appt">
        <div class="field">
          <label>Mascota</label>
          <select name="petId" required>
            ${myPets.map(p=>`<option value="${p.id}">${p.emoji} ${esc(p.name)}</option>`).join('')}
          </select>
        </div>
        <div class="field">
          <label>Proveedor / Lugar</label>
          <input type="text" name="provider" placeholder="Ej. Clínica VetCare" required>
        </div>
        <div class="row">
          <div class="field">
            <label>Fecha</label>
            <input type="date" name="date" min="${new Date().toISOString().slice(0,10)}" required>
          </div>
          <div class="field">
            <label>Hora</label>
            <input type="time" name="time" required>
          </div>
        </div>
        <div class="field">
          <label>Notas (opcional)</label>
          <input type="text" name="notes" placeholder="Ej. vacuna, corte de pelo...">
        </div>
        <button class="btn block" type="submit">Confirmar cita</button>
      </form>
    </div>
    <h2 class="section-title">Mis próximas citas</h2>
    <div class="card">
      ${upcoming.map(a=>renderAppt(a)).join('') || `<div class="empty-state"><div class="ic">🗓️</div>No tienes citas agendadas.</div>`}
    </div>
  `;
}
function renderAppt(a){
  const pet = state.pets[a.petId];
  const svc = state.services.find(s=>s.id===a.serviceId) || {icon:'📌', name:'Cita'};
  const d = new Date(a.date+'T00:00:00');
  const dateLabel = d.toLocaleDateString('es-ES', {day:'2-digit', month:'short'});
  return `
    <div class="appt-item">
      <div class="appt-ic">${svc.icon}</div>
      <div class="appt-info">
        <div class="t1">${svc.name} · ${esc(pet.name)}</div>
        <div class="t2">${esc(a.provider)} — ${dateLabel}, ${a.time}${a.notes?' · '+esc(a.notes):''}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
        <span class="status-pill ${a.status}">${a.status}</span>
        <button class="btn outline sm" data-action="cancel-appt" data-id="${a.id}">Cancelar</button>
      </div>
    </div>`;
}

/* ---------------- MARKETPLACE ---------------- */
function renderMarket(){
  const cats = ['Todos','Alimento','Accesorios','Servicios'];
  const filtered = state.products.filter(p=> state.marketFilter==='Todos' || p.category===state.marketFilter);
  return `
    <h2 class="section-title">Tienda de mascotas 🛍️</h2>
    <div class="chip-row">
      ${cats.map(c=>`<div class="chip ${state.marketFilter===c?'active':''}" data-action="filter-market" data-cat="${c}">${c}</div>`).join('')}
    </div>
    <div class="market-grid">
      ${filtered.map(p=>renderProduct(p)).join('') || `<div class="empty-state"><div class="ic">🛒</div>No hay productos en esta categoría.</div>`}
    </div>
  `;
}
function renderProduct(p){
  const photo = p.photo ? `<img class="product-photo" src="${p.photo}">` : `<div class="product-photo">${p.emoji}</div>`;
  return `
  <div class="product-card">
    ${photo}
    <div class="product-body">
      <div class="product-title">${esc(p.title)}</div>
      <div class="product-price">${money(p.price)}</div>
      <div class="product-seller">Vende: ${esc(p.sellerId==='me'?state.currentUser.name:state.users[p.sellerId]?.name||'')}</div>
      <button class="btn secondary sm" style="width:100%;" data-action="contact-seller" data-id="${p.id}">Contactar</button>
    </div>
  </div>`;
}

/* ---------------- MESSAGES ---------------- */
function renderMessages(){
  if(state.activeConvId){
    return renderChatThread(state.activeConvId);
  }
  const convs = Object.values(state.conversations).sort((a,b)=>{
    const la = a.messages[a.messages.length-1]?.time||0;
    const lb = b.messages[b.messages.length-1]?.time||0;
    return lb-la;
  });
  return `
    <h2 class="section-title">Mensajes 💬</h2>
    ${convs.map(c=>{
      const u = state.users[c.userId];
      const last = c.messages[c.messages.length-1];
      return `
      <div class="conv-item" data-action="open-conv" data-id="${c.userId}">
        <div class="avatar">${u.avatarEmoji}</div>
        <div class="conv-info">
          <div class="conv-name">${esc(u.name)}</div>
          <div class="conv-preview">${last ? esc(last.text) : 'Sin mensajes'}</div>
        </div>
        ${c.unread>0 ? `<span class="unread-badge">${c.unread}</span>` : ''}
      </div>`;
    }).join('') || `<div class="empty-state"><div class="ic">💬</div>No tienes conversaciones aún.</div>`}
  `;
}
function renderChatThread(userId){
  const conv = state.conversations[userId];
  const u = state.users[userId];
  return `
    <div class="chat-header">
      <button class="back-btn" data-action="back-to-convs">←</button>
      <div class="avatar sm">${u.avatarEmoji}</div>
      <div class="conv-name">${esc(u.name)}</div>
    </div>
    <div class="chat-thread">
      ${conv.messages.map(m=>`<div class="msg-bubble ${m.from==='me'?'me':'them'}">${esc(m.text)}</div>`).join('')}
    </div>
    <form class="chat-input-row" data-action="send-msg" data-id="${userId}">
      <input type="text" name="msg" placeholder="Escribe un mensaje..." autocomplete="off" required>
      <button class="btn sm" type="submit">➤</button>
    </form>
  `;
}

/* ---------------- PROFILE ---------------- */
function renderProfile(){
  const u = state.currentUser;
  const myPets = petsOfUser('me');
  const myPosts = state.posts.filter(p=>p.ownerId==='me').length;
  const myAppts = state.appointments.length;
  const myProducts = state.products.filter(p=>p.sellerId==='me').length;
  return `
    <div class="profile-header">
      ${u.photo ? `<img class="profile-avatar" src="${u.photo}">` : `<div class="profile-avatar">${u.avatarEmoji}</div>`}
      <div class="profile-name">${esc(u.name)}</div>
      <div class="muted">${esc(u.bio)}</div>
    </div>
    <div class="stats-row">
      <div class="stat"><b>${myPosts}</b><span>Posts</span></div>
      <div class="stat"><b>${myAppts}</b><span>Citas</span></div>
      <div class="stat"><b>${myProducts}</b><span>En venta</span></div>
      <div class="stat"><b>${myPets.length}</b><span>Mascotas</span></div>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">Mis mascotas</h2>
      ${myPets.map(p=>`
        <div class="pet-card">
          ${p.photo ? `<img class="pet-avatar" src="${p.photo}">` : `<div class="pet-avatar">${p.emoji}</div>`}
          <div style="flex:1;">
            <div class="t1">${esc(p.name)}</div>
            <div class="t2">${esc(p.species)} · ${esc(p.breed)}</div>
          </div>
        </div>`).join('')}
      <button class="btn outline block" style="margin-top:10px;" data-action="open-add-pet">+ Añadir mascota</button>
    </div>
    <div class="card">
      <h2 class="section-title" style="margin-top:0;">Publicar producto</h2>
      <p class="muted" style="margin-top:-6px;">¿Tienes algo para vender? Publícalo en la tienda.</p>
      <button class="btn secondary block" data-action="open-add-product">+ Vender un producto</button>
    </div>
  `;
}

/* ---------------- MODALS ---------------- */
function openModal(html){
  document.getElementById('modalSheet').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
  attachModalHandlers();
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalSheet').innerHTML = '';
}
function newPostModal(){
  const myPets = petsOfUser('me');
  openModal(`
    <div class="modal-title">Nueva publicación 📸 <button class="close-x" data-action="close-modal">✕</button></div>
    <form data-action="submit-post">
      <div class="field">
        <label>Mascota</label>
        <select name="petId">${myPets.map(p=>`<option value="${p.id}">${p.emoji} ${esc(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Foto</label>
        <div class="photo-input-preview" id="postPhotoPreview">📷</div>
        <input type="file" accept="image/*" id="postPhotoInput" style="padding:6px;">
      </div>
      <div class="field">
        <label>Descripción</label>
        <textarea name="caption" rows="3" placeholder="Cuéntanos sobre este momento..." required></textarea>
      </div>
      <button class="btn block" type="submit">Publicar</button>
    </form>
  `);
}
function newProductModal(){
  openModal(`
    <div class="modal-title">Vender producto 🏷️ <button class="close-x" data-action="close-modal">✕</button></div>
    <form data-action="submit-product">
      <div class="field">
        <label>Foto</label>
        <div class="photo-input-preview" id="prodPhotoPreview">🏷️</div>
        <input type="file" accept="image/*" id="prodPhotoInput" style="padding:6px;">
      </div>
      <div class="field"><label>Título</label><input type="text" name="title" required placeholder="Ej. Cama para perro talla M"></div>
      <div class="row">
        <div class="field"><label>Precio (USD)</label><input type="number" name="price" min="0" step="0.01" required></div>
        <div class="field"><label>Categoría</label>
          <select name="category"><option>Alimento</option><option>Accesorios</option><option>Servicios</option></select>
        </div>
      </div>
      <div class="field"><label>Descripción</label><textarea name="desc" rows="2" placeholder="Detalles del producto..."></textarea></div>
      <button class="btn secondary block" type="submit">Publicar producto</button>

function addPetModal(){
  openModal(`
    <div class="modal-title">Añadir mascota 🐾 <button class="close-x" data-action="close-modal">✕</button></div>
    <form data-action="submit-pet">
      <div class="field">
        <label>Foto</label>
        <div class="photo-input-preview" id="petPhotoPreview">🐾</div>
        <input type="file" accept="image/*" id="petPhotoInput" style="padding:6px;">
      </div>
      <div class="field"><label>Nombre</label><input type="text" name="name" required placeholder="Ej. Firulais"></div>
      <div class="row">
        <div class="field"><label>Especie</label>
          <select name="species">
            <option value="Perro">🐕 Perro</option><option value="Gato">🐈 Gato</option>
            <option value="Ave">🐦 Ave</option><option value="Conejo">🐰 Conejo</option><option value="Otro">🐾 Otro</option>
          </select>
        </div>
        <div class="field"><label>Raza</label><input type="text" name="breed" placeholder="Ej. Labrador"></div>
      </div>
      <button class="btn block" type="submit">Guardar mascota</button>
    </form>
  `);
}

/* ---------------- EVENT HANDLERS ---------------- */
let tempPhotoData = { post:null, product:null, pet:null };

function attachModalHandlers(){
  const postInput = document.getElementById('postPhotoInput');
  if(postInput) postInput.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    readFileAsDataUrl(f, url=>{ tempPhotoData.post = url; document.getElementById('postPhotoPreview').innerHTML = `<img src="${url}">`; });
  });
  const prodInput = document.getElementById('prodPhotoInput');
  if(prodInput) prodInput.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    readFileAsDataUrl(f, url=>{ tempPhotoData.product = url; document.getElementById('prodPhotoPreview').innerHTML = `<img src="${url}">`; });
  });
  const petInput = document.getElementById('petPhotoInput');
  if(petInput) petInput.addEventListener('change', e=>{
    const f = e.target.files[0]; if(!f) return;
    readFileAsDataUrl(f, url=>{ tempPhotoData.pet = url; document.getElementById('petPhotoPreview').innerHTML = `<img src="${url}">`; });
  });

  document.getElementById('modalSheet').addEventListener('click', e=>{
    const t = e.target.closest('[data-action="close-modal"]');
    if(t) closeModal();
  });

  const postForm = document.querySelector('[data-action="submit-post"]');
  if(postForm) postForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(postForm);
    const petId = fd.get('petId');
    const gradients = ['linear-gradient(135deg,#89CFF0,#4ECDC4)','linear-gradient(135deg,#FFC65C,#FF7A59)','linear-gradient(135deg,#A8E6CF,#3FB68B)','linear-gradient(135deg,#D8B4F8,#9D7BD8)'];
    state.posts.unshift({
      id: uid(), petId, ownerId:'me', caption: fd.get('caption'),
      photo: tempPhotoData.post, photoEmoji: state.pets[petId].emoji,
      gradient: gradients[Math.floor(Math.random()*gradients.length)],
      likes:[], comments:[], time: Date.now()
    });
    tempPhotoData.post = null;
    closeModal(); state.view='feed'; render();
    showToast('¡Publicación creada! 🎉');
  });

  const prodForm = document.querySelector('[data-action="submit-product"]');
  if(prodForm) prodForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(prodForm);
    state.products.unshift({
      id: uid(), title: fd.get('title'), price: parseFloat(fd.get('price'))||0,
      category: fd.get('category'), sellerId:'me', emoji:'🏷️', photo: tempPhotoData.product,
      desc: fd.get('desc')
    });
    tempPhotoData.product = null;
    closeModal(); state.view='market'; state.marketFilter='Todos'; render();
    showToast('¡Producto publicado! 🏷️');
  });

  const petForm = document.querySelector('[data-action="submit-pet"]');
  if(petForm) petForm.addEventListener('submit', e=>{
    e.preventDefault();
    const fd = new FormData(petForm);
    const species = fd.get('species');
    const emojiMap = {Perro:'🐕', Gato:'🐈', Ave:'🐦', Conejo:'🐰', Otro:'🐾'};
    const id = uid();
    state.pets[id] = { id, name: fd.get('name'), species, breed: fd.get('breed')||'—', emoji: emojiMap[species]||'🐾', ownerId:'me', photo: tempPhotoData.pet };
    state.currentUser.pets.push(id);
    tempPhotoData.pet = null;
    closeModal(); render();
    showToast('¡Mascota añadida! 🐾');
  });
}

function attachViewHandlers(){
  const body = document.getElementById('appBody');

  body.querySelectorAll('[data-action="like"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const post = state.posts.find(p=>p.id===btn.dataset.id);
      const idx = post.likes.indexOf('me');
      if(idx>-1) post.likes.splice(idx,1); else post.likes.push('me');
      render();
    });
  });

  body.querySelectorAll('[data-action="comment"]').forEach(form=>{
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const input = form.querySelector('input[name="comment"]');
      const text = input.value.trim();
      if(!text) return;
      const post = state.posts.find(p=>p.id===form.dataset.id);
      post.comments.push({userId:'me', text});
      render();
    });
  });

  body.querySelectorAll('[data-action="pick-service"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.selectedServiceId = state.selectedServiceId===el.dataset.id ? null : el.dataset.id;
      render();
    });
  });

  const apptForm = document.getElementById('apptForm');
  if(apptForm) apptForm.addEventListener('submit', e=>{
    e.preventDefault();
    if(!state.selectedServiceId){ showToast('Selecciona un tipo de servicio ⬆️'); return; }
    const fd = new FormData(apptForm);
    state.appointments.push({
      id: uid(), petId: fd.get('petId'), serviceId: state.selectedServiceId,
      provider: fd.get('provider'), location:'', date: fd.get('date'), time: fd.get('time'),
      status:'pendiente', notes: fd.get('notes')||''
    });
    state.selectedServiceId = null;
    render();
    showToast('¡Cita agendada con éxito! 📅');
  });

  body.querySelectorAll('[data-action="cancel-appt"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.appointments = state.appointments.filter(a=>a.id!==btn.dataset.id);
      render();
      showToast('Cita cancelada');
    });
  });

  body.querySelectorAll('[data-action="filter-market"]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      state.marketFilter = chip.dataset.cat;
      render();
    });
  });

  body.querySelectorAll('[data-action="contact-seller"]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const prod = state.products.find(p=>p.id===btn.dataset.id);
      if(prod.sellerId==='me'){ showToast('Este es tu propio producto 🙂'); return; }
      if(!state.conversations[prod.sellerId]){
        state.conversations[prod.sellerId] = { userId: prod.sellerId, unread:0, messages:[] };
      }
      state.conversations[prod.sellerId].messages.push({from:'me', text:`Hola, ¿está disponible "${prod.title}"?`, time:Date.now()});
      state.activeConvId = prod.sellerId;
      state.view = 'messages';
      render();
      simulateReply(prod.sellerId, '¡Hola! Sí, sigue disponible 😊 ¿Cuándo te gustaría coordinarlo?');
    });
  });

  body.querySelectorAll('[data-action="open-conv"]').forEach(el=>{
    el.addEventListener('click', ()=>{
      state.activeConvId = el.dataset.id;
      state.conversations[el.dataset.id].unread = 0;
      render();
    });
  });

  const backBtn = body.querySelector('[data-action="back-to-convs"]');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.activeConvId=null; render(); });

  const sendForm = body.querySelector('[data-action="send-msg"]');
  if(sendForm) sendForm.addEventListener('submit', e=>{
    e.preventDefault();
    const input = sendForm.querySelector('input[name="msg"]');
    const text = input.value.trim();
    if(!text) return;
    const uid_ = sendForm.dataset.id;
    state.conversations[uid_].messages.push({from:'me', text, time:Date.now()});
    render();
    document.querySelector('.chat-thread')?.scrollIntoView({block:'end'});
    simulateReply(uid_, pickAutoReply());
  });

  const addPetBtn = body.querySelector('[data-action="open-add-pet"]');
  if(addPetBtn) addPetBtn.addEventListener('click', addPetModal);

  const addProductBtn = body.querySelector('[data-action="open-add-product"]');
  if(addProductBtn) addProductBtn.addEventListener('click', newProductModal);
}

function pickAutoReply(){
  const replies = [
    '¡Genial, gracias por escribir! 🐾',
    'Claro, dame un momento para revisarlo 🙂',
    '¡Perfecto! Te confirmo en breve.',
    'Suena bien, ¡hablamos pronto! 🐶',
  ];
  return replies[Math.floor(Math.random()*replies.length)];
}
function simulateReply(userId, text){
  setTimeout(()=>{
    const conv = state.conversations[userId];
    if(!conv) return;
    conv.messages.push({from:userId, text, time:Date.now()});
    if(state.view==='messages' && state.activeConvId===userId){
      render();
    } else {
      conv.unread = (conv.unread||0)+1;
      updateNotifDot();
    }
  }, 1400);
}

/* ---------------- NAV & GLOBAL ---------------- */
document.getElementById('bottomNav').addEventListener('click', e=>{
  const btn = e.target.closest('.nav-btn');
  if(!btn) return;
  state.view = btn.dataset.view;
  if(state.view!=='messages') state.activeConvId = null;
  render();
});
document.getElementById('fabBtn').addEventListener('click', ()=>{
  if(state.view==='market') newProductModal(); else newPostModal();
});
document.getElementById('notifBtn').addEventListener('click', ()=>{
  state.view='messages'; state.activeConvId=null; render();
});
document.getElementById('modalOverlay').addEventListener('click', e=>{
  if(e.target.id==='modalOverlay') closeModal();
});

render();
</script>
</body>
</html>
